version: '3.9'

services:
  db:
    image: postgres:16
    container_name: bazar_db
    environment:
      POSTGRES_DB: bazar
      POSTGRES_USER: bazar
      POSTGRES_PASSWORD: bazar_pass
    ports:
      - "5432:5432"
    volumes:
      - bazar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazar -d bazar"]
      interval: 5s
      timeout: 5s
      retries: 10

  bazar.backend.api:
    container_name: bazar_backend_api
    build:
      context: .
      dockerfile: BazaR.Backend.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=bazar;Username=bazar;Password=bazar_pass

volumes:
  bazar_pgdata:
